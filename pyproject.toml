[project]
name = "rul"
version = "0.1.0"
description = "Remaining useful life prediction for NASA C-MAPSS turbofan engines"
readme = "README.md"
license = "MIT"
authors = [{ name = "Farhang Khanjani" }]
requires-python = ">=3.11"
# Runtime dependencies are added in the milestone that first needs them.
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
]

[project.scripts]
rul-data = "rul.data:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.17",
    "pre-commit>=4.0",
]
notebooks = [
    "jupyter>=1.1",
    "matplotlib>=3.9",
]

[tool.uv]
default-groups = ["dev", "notebooks"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rul"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
# Notebooks are exploratory: allow long lines, multiple statements per line, and short names
"notebooks/*" = ["E501", "E701", "E702", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
